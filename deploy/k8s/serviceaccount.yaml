# Kubernetes ServiceAccount federated to the user-assigned managed identity
# (UAMI) the worker pods authenticate as. The annotation ties this SA to the
# UAMI's client id; the federated credential created during setup
# (az identity federated-credential / New-AzFederatedIdentityCredential) MUST
# name this SA as its subject: system:serviceaccount:rda:rda-sa.
#
# Replace <UAMI-client-id> with the UAMI's clientId before applying.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rda-sa
  namespace: rda
  annotations:
    azure.workload.identity/client-id: <UAMI-client-id>
