# Indexed Job that runs one RDA shard per pod. Kubernetes exposes
# JOB_COMPLETION_INDEX (0..completions-1) to each pod, and entrypoint.ps1 uses
# it as the shard index. Run all shards at once with parallelism == completions.
#
# IMPORTANT: completions, parallelism, and the SHARD_COUNT env value MUST all be
# equal - they are the number of shards splitting the tenant. Change all three
# together.
#
# Replace <acr> with your registry name before applying.
apiVersion: batch/v1
kind: Job
metadata:
  name: rda-shards
  namespace: rda
spec:
  completions: 10           # ShardCount (number of shards / pods)
  parallelism: 10           # run all shards at once (== completions)
  completionMode: Indexed   # exposes JOB_COMPLETION_INDEX to each pod
  backoffLimit: 0           # a shard failure is surfaced, not silently retried
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: rda-sa
      restartPolicy: Never
      containers:
      - name: rda
        image: <acr>.azurecr.io/rda:latest
        imagePullPolicy: Always   # re-pull when a reused tag changes
        env:
        - name: SHARD_COUNT
          value: "10"             # MUST equal completions/parallelism above
        # Optional knobs (uncomment to use):
        # - name: ALLOW_PARTIAL_ACCESS  # "true" = proceed even if the identity cannot verify
        #   value: "true"               # FULL subscription coverage (read every sub under the
        #                               # tenant-root management group) or cannot read a sub it
        #                               # enumerated. DEFAULT (unset) HARD-STOPS such a shard,
        #                               # because the tool's job is to capture ALL subscriptions.
        #                               # For production, instead grant the UAMI Reader at the
        #                               # tenant-root management group (inherits to every sub AND
        #                               # makes coverage verifiable). Use this only for a
        #                               # deliberate partial/test run (e.g. a first demo before
        #                               # MG-root Reader is in place); it warns loudly and
        #                               # proceeds with whatever subscriptions are visible.
        # - name: HEAD_ROOM         # leave N% of API concurrency in reserve
        #   value: "20"
        # - name: SKIP_METRICS      # "true" to skip the metrics phase
        #   value: "true"
        # - name: SKIP_CONSUMPTION  # "true" to skip the consumption phase
        #   value: "true"
        # - name: USE_METRICS_BATCH # "true" = Azure Monitor metrics:getBatch data-plane
        #   value: "true"           # fast-path (VM/disk/storage/SQL/scale-set/Cosmos; per-call
        #                           # fallback). Cuts the metrics phase's API-call volume on
        #                           # large tenants. Needs Microsoft.Insights registered (the
        #                           # tool attempts this) + Reader/Monitoring Reader.
        # - name: PARALLEL_STREAMS  # per-pod concurrency ACROSS this pod's cores (distinct
        #   value: "6"              # from sharding ACROSS pods). Omit to auto-tune from CPU/RAM;
        #                           # capped ~6 by the tenant ARG rate limit. Ensure the node has
        #                           # RAM headroom (~0.7 GB per stream at metrics-phase peak).
        # - name: UPLOAD_BLOB_URI   # collect every shard's zip in one container
        #   value: "https://<account>.blob.core.windows.net/<container>"
        #   # Needs "Storage Blob Data Contributor" for the UAMI on that account.
        #   # Each pod uploads its own zip (blob name is made unique per shard),
        #   # so you don't exec into every node to fetch output.
